name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frontend:
    name: Frontend — build check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Desktop/ConstructaDev/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Desktop/ConstructaDev/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  backend:
    name: Backend — import check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Desktop/ConstructaDev/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: Desktop/ConstructaDev/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check imports
        run: python -c "from app.main import app; print('OK')"
        env:
          SECRET_KEY: ci-secret-key-not-real
          DATABASE_URL: postgresql+asyncpg://user:pass@localhost/db
