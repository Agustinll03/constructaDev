name: CI / CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ── 1. Backend: unit tests (no DB required) ────────────────────────────────
  test-backend-unit:
    name: Backend — unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Desktop/ConstructaDev/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: Desktop/ConstructaDev/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short
        env:
          SECRET_KEY: ci-secret-not-real-32-chars-padded
          DATABASE_URL: postgresql+asyncpg://user:pass@localhost/db

  # ── 2. Backend: integration tests (PostgreSQL service) ────────────────────
  test-backend-integration:
    name: Backend — integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Desktop/ConstructaDev/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: Desktop/ConstructaDev/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short
        env:
          SECRET_KEY: ci-secret-not-real-32-chars-padded
          DATABASE_URL: postgresql+asyncpg://testuser:testpass@localhost:5432/testdb
          TEST_DATABASE_URL: postgresql+asyncpg://testuser:testpass@localhost:5432/testdb

  # ── 3. Frontend: unit tests + build ───────────────────────────────────────
  test-build-frontend:
    name: Frontend — unit tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Desktop/ConstructaDev/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Desktop/ConstructaDev/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

  # ── 4. Deploy backend (on push to master, after all checks pass) ──────────
  deploy-backend:
    name: Deploy backend to Render
    runs-on: ubuntu-latest
    needs: [test-backend-unit, test-backend-integration, test-build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Trigger Render deploy
        run: curl -s "${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}"

  # ── 5. Deploy frontend (after backend deploy) ─────────────────────────────
  deploy-frontend:
    name: Deploy frontend to Render
    runs-on: ubuntu-latest
    needs: [deploy-backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Trigger Render deploy
        run: curl -s "${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}"
